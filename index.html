<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎄 圣诞快乐 - Merry Christmas 🎄</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas&family=Dancing+Script:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- 雪花容器 -->
    <div id="snowflakes"></div>
    
    <!-- 主要内容 -->
    <div class="container">
        <!-- 标题区域 -->
        <header class="header">
            <h1 class="main-title">🎄 圣诞快乐 🎄</h1>
            <h2 class="sub-title">Merry Christmas & Happy New Year</h2>
        </header>

        <!-- 圣诞树区域 -->
        <div class="christmas-tree-container">
            <div class="christmas-tree">
                <!-- 星星光环 -->
                <div class="star-halo"></div>
                <div class="star">⭐</div>
                
                <!-- 树的层级 - 更多层次 -->
                <div class="tree-section section-1">
                    <div class="tree-layer layer-1-1">
                        <div class="tree-part"></div>
                        <div class="tree-shadow"></div>
                    </div>
                    <div class="tree-layer layer-1-2">
                        <div class="tree-part"></div>
                        <div class="tree-shadow"></div>
                    </div>
                </div>
                
                <div class="tree-section section-2">
                    <div class="tree-layer layer-2-1">
                        <div class="tree-part"></div>
                        <div class="tree-shadow"></div>
                    </div>
                    <div class="tree-layer layer-2-2">
                        <div class="tree-part"></div>
                        <div class="tree-shadow"></div>
                    </div>
                    <div class="tree-layer layer-2-3">
                        <div class="tree-part"></div>
                        <div class="tree-shadow"></div>
                    </div>
                </div>
                
                <div class="tree-section section-3">
                    <div class="tree-layer layer-3-1">
                        <div class="tree-part"></div>
                        <div class="tree-shadow"></div>
                    </div>
                    <div class="tree-layer layer-3-2">
                        <div class="tree-part"></div>
                        <div class="tree-shadow"></div>
                    </div>
                    <div class="tree-layer layer-3-3">
                        <div class="tree-part"></div>
                        <div class="tree-shadow"></div>
                    </div>
                    <div class="tree-layer layer-3-4">
                        <div class="tree-part"></div>
                        <div class="tree-shadow"></div>
                    </div>
                </div>
                
                <!-- 树干和底座 -->
                <div class="tree-trunk">
                    <div class="trunk-highlight"></div>
                </div>
                <div class="tree-base"></div>
                
                <!-- 高级装饰品 -->
                <div class="ornament-group">
                    <div class="ornament crystal-ball ornament-1">💎</div>
                    <div class="ornament golden-ball ornament-2">🟨</div>
                    <div class="ornament silver-ball ornament-3">⚪</div>
                    <div class="ornament ruby-ball ornament-4">🔴</div>
                    <div class="ornament emerald-ball ornament-5">🟢</div>
                    <div class="ornament sapphire-ball ornament-6">🔵</div>
                    <div class="ornament amethyst-ball ornament-7">🟣</div>
                    <div class="ornament topaz-ball ornament-8">🟠</div>
                    <div class="ornament pearl-ball ornament-9">🤍</div>
                    <div class="ornament rose-ball ornament-10">🌹</div>
                </div>
                
                <!-- 彩带装饰 -->
                <div class="ribbon ribbon-1"></div>
                <div class="ribbon ribbon-2"></div>
                <div class="ribbon ribbon-3"></div>
                
                <!-- 高级彩灯系统 -->
                <div class="light-string string-1">
                    <div class="light light-1-1"></div>
                    <div class="light light-1-2"></div>
                    <div class="light light-1-3"></div>
                    <div class="light light-1-4"></div>
                    <div class="light light-1-5"></div>
                </div>
                <div class="light-string string-2">
                    <div class="light light-2-1"></div>
                    <div class="light light-2-2"></div>
                    <div class="light light-2-3"></div>
                    <div class="light light-2-4"></div>
                    <div class="light light-2-5"></div>
                    <div class="light light-2-6"></div>
                </div>
                <div class="light-string string-3">
                    <div class="light light-3-1"></div>
                    <div class="light light-3-2"></div>
                    <div class="light light-3-3"></div>
                    <div class="light light-3-4"></div>
                    <div class="light light-3-5"></div>
                    <div class="light light-3-6"></div>
                    <div class="light light-3-7"></div>
                </div>
                
                <!-- 雪花装饰 -->
                <div class="tree-snow snow-1">❄</div>
                <div class="tree-snow snow-2">❅</div>
                <div class="tree-snow snow-3">❆</div>
                <div class="tree-snow snow-4">✻</div>
                
                <!-- 树的光晕效果 -->
                <div class="tree-glow"></div>
            </div>
        </div>

        <!-- 礼物盒区域 -->
        <div class="gifts-container">
            <div class="gift gift-1">
                <div class="gift-box"></div>
                <div class="gift-ribbon"></div>
                <div class="gift-bow"></div>
            </div>
            <div class="gift gift-2">
                <div class="gift-box"></div>
                <div class="gift-ribbon"></div>
                <div class="gift-bow"></div>
            </div>
            <div class="gift gift-3">
                <div class="gift-box"></div>
                <div class="gift-ribbon"></div>
                <div class="gift-bow"></div>
            </div>
        </div>

        <!-- 祝福语区域 -->
        <div class="wishes-container">
            <div class="wish-card">
                <h3>🎅 圣诞祝福 🎅</h3>
                <p>愿你的圣诞充满温馨，新年拥有美好！</p>
                <p>May your Christmas be filled with warmth and your New Year be wonderful!</p>
            </div>
        </div>

        <!-- 控制按钮 -->
        <div class="controls">
            <button id="musicBtn" class="control-btn">🎵 播放音乐</button>
            <button id="snowBtn" class="control-btn">❄️ 雪花开关</button>
            <button id="lightsBtn" class="control-btn">💡 彩灯开关</button>
        </div>
    </div>

    <!-- 背景音乐 -->
    <audio id="bgMusic" loop>
        <source src="https://www.soundjay.com/misc/sounds/bell-ringing-05.wav" type="audio/wav">
        <!-- 备用音频源 -->
    </audio>

    <script src="script.js"></script>
</body>
</html>
